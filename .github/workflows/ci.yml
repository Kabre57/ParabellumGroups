name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secrets_scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repository secret scan
        run: bash scripts/scan-secrets.sh

  prisma_migrate_deploy:
    name: Prisma Migrate Deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: services/auth-service
            db: parabellum_auth
          - service: services/communication-service
            db: parabellum_communication
          - service: services/technical-service
            db: parabellum_technical
          - service: services/commercial-service
            db: parabellum_commercial
          - service: services/inventory-service
            db: parabellum_inventory
          - service: services/project-service
            db: parabellum_projects
          - service: services/procurement-service
            db: parabellum_procurement
          - service: services/customer-service
            db: parabellum_customers
          - service: services/billing-service
            db: parabellum_billing
          - service: services/analytics-service
            db: parabellum_Analytics
          - service: services/notification-service
            db: parabellum_notification
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: replace-with-ci-db-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.service }}/pnpm-lock.yaml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Ensure database exists
        env:
          PGPASSWORD: replace-with-ci-db-password
        run: |
          if ! psql -h localhost -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${{ matrix.db }}'" | grep -q 1; then
            psql -h localhost -U postgres -d postgres -c "CREATE DATABASE \"${{ matrix.db }}\";"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:replace-with-ci-db-password@localhost:5432/${{ matrix.db }}?schema=public
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma

  frontend_quality:
    name: Frontend Lint + Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

  backend_smoke_tests:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/auth-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.service }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke tests
        run: pnpm test

  api_gateway_tests:
    name: API Gateway Tests (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/api-gateway/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke tests
        run: pnpm test

  backend_syntax:
    name: JavaScript Syntax for Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check backend JavaScript syntax
        run: >-
          node scripts/check-js-syntax.mjs
          services/communication-service
          services/technical-service
          services/commercial-service
          services/inventory-service
          services/project-service
          services/procurement-service
          services/analytics-service
          services/notification-service

  docker_compose_build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI .env
        run: |
          cat > .env <<'EOF'
          DB_USER=postgres
          DB_PASSWORD=replace-with-ci-db-password
          REDIS_PASSWORD=replace-with-ci-redis-password
          JWT_SECRET=replace-with-ci-jwt-secret
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=replace-with-ci-minio-password
          EOF

      - name: Validate docker-compose
        run: docker compose config

      - name: Build docker-compose images
        run: docker compose build --parallel
