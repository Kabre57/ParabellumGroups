services:
  # ==================== INFRASTRUCTURE ====================
  postgres:
    image: postgres:15-alpine
    container_name: parabellum-db
    restart: always
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_MULTIPLE_DATABASES: >
        parabellum_auth,
        parabellum_communication,
        parabellum_technical,
        parabellum_commercial,
        parabellum_inventory,
        parabellum_projects,
        parabellum_procurement,
        parabellum_customers,
        parabellum_hr,
        parabellum_billing,
        parabellum_Analytics,
        parabellum_notification
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-bootstrap:
    image: postgres:15-alpine
    container_name: parabellum-db-bootstrap
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./scripts/postgres-bootstrap.sh:/scripts/postgres-bootstrap.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/postgres-bootstrap.sh"]

  redis:
    image: redis:alpine
    container_name: parabellum-redis
    restart: always
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD is required} ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Build the archived community release locally; upstream image pulls return 401.
    image: parabellum/minio-community:${MINIO_IMAGE_TAG:-RELEASE.2025-10-15T17-29-55Z}
    build:
      context: ./docker/minio
      dockerfile: Dockerfile.server
      args:
        MINIO_VERSION: ${MINIO_IMAGE_TAG:-RELEASE.2025-10-15T17-29-55Z}
    container_name: parabellum-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: parabellum/minio-mc:${MINIO_MC_IMAGE_TAG:-RELEASE.2025-08-13T08-35-41Z}
    build:
      context: ./docker/minio
      dockerfile: Dockerfile.mc
      args:
        MC_VERSION: ${MINIO_MC_IMAGE_TAG:-RELEASE.2025-08-13T08-35-41Z}
    container_name: parabellum-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-parabellum-groups}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/rapport-photos || true &&
      mc mb -p local/$${S3_BUCKET_NAME:-parabellum-groups} || true &&
      mc anonymous set download local/rapport-photos &&
      mc anonymous set download local/$${S3_BUCKET_NAME:-parabellum-groups} &&
      mc mb -p local/communication-attachments || true &&
      exit 0;
      "

  # ==================== FRONTEND ====================
  frontend:
    build: ./frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      api-gateway:
        condition: service_healthy
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.28-alpine
    container_name: parabellum-nginx
    restart: always
    ports:
      - "${NGINX_HOST_IP:-0.0.0.0}:${NGINX_HOST_PORT:-8080}:80"
      - "${FRONTEND_HOST_IP:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:80"
      - "127.0.0.1:3001:3001"
    volumes:
      - ./nginx-parabellum.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
        restart: true
      api-gateway:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== API GATEWAY ====================
  api-gateway:
    build: ./services/api-gateway
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      # URLs des services (utilise les noms Docker)
      - AUTH_SERVICE_URL=http://auth-service:4001
      - COMMUNICATION_SERVICE_URL=http://communication-service:4002
      - TECHNICAL_SERVICE_URL=http://technical-service:4003
      - COMMERCIAL_SERVICE_URL=http://commercial-service:4004
      - INVENTORY_SERVICE_URL=http://inventory-service:4005
      - PROJECTS_SERVICE_URL=http://project-service:4006
      - PROCUREMENT_SERVICE_URL=http://procurement-service:4007
      - CUSTOMERS_SERVICE_URL=http://customer-service:4008
      - HR_SERVICE_URL=${HR_SERVICE_URL:-http://host.docker.internal:8001}
      - BILLING_SERVICE_URL=http://billing-service:4010
      - ANALYTICS_SERVICE_URL=http://analytics-service:4011
      - NOTIFICATIONS_SERVICE_URL=http://notification-service:4012
      # Accounting screens make several read requests in parallel; writes stay at 50/15 min.
      - BILLING_READ_RATE_LIMIT_MAX=${BILLING_READ_RATE_LIMIT_MAX:-300}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      communication-service:
        condition: service_healthy
      technical-service:
        condition: service_healthy
      commercial-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      procurement-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MICROSERVICES ====================
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    restart: always
    environment:
      - PORT=4001
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      # Used by the entrypoint health and initialization checks.
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=parabellum_auth
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/parabellum_auth?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-admin@parabellum-erp.online}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-parabellum-groups}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  communication-service:
    build: ./services/communication-service
    container_name: communication-service
    restart: always
    entrypoint: ["sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      - PORT=4002
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/parabellum_communication?schema=public
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-admin@parabellum-erp.online}
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET_NAME=communication-attachments
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - S3_FORCE_PATH_STYLE=true
    volumes:
      - ./scripts/service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  technical-service:
    build: ./services/technical-service
    container_name: technical-service
    restart: always
    entrypoint: ["sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      - PORT=4003
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/parabellum_technical?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - MINIO_BUCKET=rapport-photos
      - MINIO_PUBLIC_URL=http://localhost:9000
      - MINIO_INTERNAL_URL=http://minio:9000
      - MINIO_USE_SSL=false
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - REPORT_LOGO_URL=http://frontend:3000/parabellum.jpg
    volumes:
      - ./scripts/service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  commercial-service:
    build: ./services/commercial-service
    container_name: commercial-service
    restart: always
    entrypoint: ["sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      - PORT=4004
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/parabellum_commercial?schema=public
    volumes:
      - ./scripts/service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-service:
    build: ./services/inventory-service
    container_name: inventory-service
    restart: always
    entrypoint: ["sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      - PORT=4005
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/parabellum_inventory?schema=public
      - AUTH_SERVICE_URL=http://auth-service:4001
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-parabellum-groups}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD}}
    volumes:
      - ./scripts/service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4005/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  project-service:
    build: ./services/project-service
    container_name: project-service
    restart: always
    entrypoint: ["sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      - PORT=4006
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/parabellum_projects?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
    volumes:
      - ./scripts/service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4006/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  procurement-service:
    build: ./services/procurement-service
    container_name: procurement-service
    restart: always
    entrypoint: ["sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      - PORT=4007
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/parabellum_procurement?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
    volumes:
      - ./scripts/service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4007/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  customer-service:
    build: ./services/customer-service
    container_name: customer-service
    restart: always
    entrypoint: ["sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      - PORT=4008
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/parabellum_customers?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
    volumes:
      - ./scripts/service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4008/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-service:
    build: ./services/billing-service
    container_name: billing-service
    restart: always
    entrypoint: ["sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      - PORT=4010
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/parabellum_billing?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - PROJECTS_SERVICE_URL=http://project-service:4006
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-parabellum-groups}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD}}
    volumes:
      - ./scripts/service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4010/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-service:
    build: ./services/analytics-service
    container_name: analytics-service
    restart: always
    entrypoint: ["sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      - PORT=4011
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/parabellum_Analytics?schema=public
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./scripts/service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4011/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    restart: always
    entrypoint: ["sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      - PORT=4012
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/parabellum_notification?schema=public
    volumes:
      - ./scripts/service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4012/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
